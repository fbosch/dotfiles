              STATE.write_text(json.dumps(data, indent=2) + "\\n")
              if args.json:
                  print(json.dumps({"ok": True, "updated": names, "count": len(names)}))
              else:
                  print(f"Updated {len(names)} repositories.")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
      ''')
      script = root / "bulk_update.py"
      script.write_text(updater)
      script.chmod(0o755)
      PY
