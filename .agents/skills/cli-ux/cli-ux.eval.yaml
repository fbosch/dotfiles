          fds = {stdout_fd: bytearray(), stderr_fd: bytearray()}
          streams = {stdout_fd: proc.stdout, stderr_fd: proc.stderr}
          signalled = False
          deadline = time.monotonic() + 5.0
          try:
              while fds and time.monotonic() < deadline:
                  remaining = deadline - time.monotonic()
                  ready, _, _ = select.select(list(fds), [], [], min(0.1, max(0.0, remaining)))
                  for fd in ready:
                      block = os.read(fd, 4096)
                      if block:
