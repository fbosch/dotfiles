      PY
    prompt: |
      Use cli-ux if available; continue without it if unavailable.

      Work in `/tmp/cli-ux-eval-task2` and improve the existing stdlib-only
      `bulk_update.py`. It accepts newline-delimited repository names on stdin and
      has `--json` and `--yes` flags. Do not use git, network access, or third-party
      packages.

      This command's machine contract is explicit. With `--json --yes`,
      `bulk_update.py` must read newline-delimited names from stdin, ignore blank
      lines, preserve the order of the nonblank names, update exactly those names,
      and write exactly one JSON object to stdout (a trailing newline is fine):
      `{"ok":true,"updated":["gamma","alpha"],"count":2}`. The object must
      have exactly those keys and types for the input `\\ngamma\\n\\nalpha\\n`,
      and stderr must remain empty.

      When stdin is not a terminal and `--yes` is absent, stdin is payload, never a
      confirmation prompt. Fail before mutation (and before consuming the payload
      as a prompt) with exit status 2 and exactly this JSON object on stdout:
      `{"ok":false,"error":{"code":"confirmation_required","message":"pass --yes when stdin is not a terminal"}}`
      (a trailing newline is fine), with no stderr output. Do not add human status
      prose or ANSI bytes to JSON stdout. Keep state for unmentioned repositories
      unchanged. Run focused checks for both the missing-confirmation error and the
      reversed-name, blank-line success path if practical.
    expect: |
      Pass if the agent treats piped stdin as newline-delimited payload rather than
      confirmation input. Without `--yes`, it must fail non-interactively with the
      requested exit status and exact machine-readable error object before changing
      state. With `--json --yes`, it must ignore blank lines, preserve the reversed
      nonblank input order, update only those names, and emit exactly the requested
      success schema on stdout with no stderr prose. The response should ground its
      claims in the fixture or checks it actually performed. Fail if it consumes a
      piped name as a yes/no answer, mutates before the required confirmation flag,
      changes JSON keys/types/order, or contaminates machine output with human UI.
    assert: |
      import json
      import os
      import select
      import signal
      import subprocess
      import sys
      import time
      from pathlib import Path

      root = Path("/tmp/cli-ux-eval-task2")
      script = root / "bulk_update.py"
      state = root / "state.json"
      owner = root / ".caliper-owner"
      assert root.is_dir() and not root.is_symlink(), "task fixture is missing or not a directory"
      assert owner.is_file() and not owner.is_symlink() and owner.read_text() == "cli-ux-task2\n", "task fixture ownership marker is invalid"
      original = (
          b'{\n'
          b'  "repositories": [\n'
          b'    {\n'
          b'      "name": "alpha",\n'
          b'      "current": "1.0",\n'
          b'      "latest": "2.0"\n'
          b'    },\n'
          b'    {\n'
          b'      "name": "beta",\n'
          b'      "current": "10.0",\n'
          b'      "latest": "11.0"\n'
          b'    },\n'
          b'    {\n'
          b'      "name": "gamma",\n'
          b'      "current": "3.0",\n'
          b'      "latest": "4.0"\n'
          b'    }\n'
          b'  ]\n'
          b'}\n'
      )

      def kill_and_wait(proc):
          if proc.poll() is None:
              try:
                  os.killpg(proc.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
          try:
              proc.wait(timeout=1.0)
          except subprocess.TimeoutExpired:
              try:
                  os.killpg(proc.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              proc.wait(timeout=1.0)

      def run_pipe(args, payload):
          proc = subprocess.Popen(
              args,
              cwd=root,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              start_new_session=True,
              close_fds=True,
          )
          stdout_fd = proc.stdout.fileno()
          stderr_fd = proc.stderr.fileno()
          fds = {stdout_fd: bytearray(), stderr_fd: bytearray()}
          streams = {stdout_fd: proc.stdout, stderr_fd: proc.stderr}
          try:
              proc.stdin.write(payload)
              proc.stdin.close()
              deadline = time.monotonic() + 5.0
              while fds and time.monotonic() < deadline:
                  remaining = deadline - time.monotonic()
                  ready, _, _ = select.select(list(fds), [], [], min(0.1, max(0.0, remaining)))
                  for fd in ready:
                      block = os.read(fd, 4096)
                      if block:
                          fds[fd].extend(block)
                      else:
                          streams[fd].close()
                          del streams[fd]
                          del fds[fd]
                  if proc.poll() is not None and not ready:
                      break
              if proc.poll() is None:
                  raise AssertionError(f"piped command exceeded deadline: {args}")
              for stream in streams.values():
                  stream.close()
              return proc.returncode, bytes(fds.get(stdout_fd, b"")), bytes(fds.get(stderr_fd, b""))
          finally:
              kill_and_wait(proc)
              for stream in (proc.stdin, proc.stdout, proc.stderr):
                  try:
                      stream.close()
                  except OSError:
                      pass

      payload = b"\ngamma\n\nalpha\n"
      code, stdout, stderr = run_pipe([sys.executable, str(script), "--json"], payload)
      assert code == 2, f"missing --yes should exit 2, got {code}: {stdout!r} {stderr!r}"
      assert stdout == stdout.rstrip(b"\n") + (b"\n" if stdout.endswith(b"\n") else b""), "error output is not one line"
      error = json.loads(stdout)
      assert error == {
          "ok": False,
          "error": {
              "code": "confirmation_required",
              "message": "pass --yes when stdin is not a terminal",
          },
      }, f"unexpected error object: {error!r}"
      assert stderr == b"", f"error polluted stderr: {stderr!r}"
      assert state.read_bytes() == original, "missing confirmation mutated state"

      code, stdout, stderr = run_pipe([sys.executable, str(script), "--json", "--yes"], payload)
      assert code == 0, f"JSON success failed: {code}: {stdout!r} {stderr!r}"
      success = json.loads(stdout)
      assert success == {"ok": True, "updated": ["gamma", "alpha"], "count": 2}, success
      assert set(success) == {"ok", "updated", "count"}, "success schema has extra or missing keys"
      assert stderr == b"", f"success polluted stderr: {stderr!r}"
      assert b"\x1b" not in stdout + stderr, "machine protocol contains ANSI bytes"
      data = json.loads(state.read_text())
      by_name = {repo["name"]: repo for repo in data["repositories"]}
      assert by_name["gamma"]["current"] == "4.0"
      assert by_name["alpha"]["current"] == "2.0"
      assert by_name["beta"]["current"] == "10.0", "unmentioned repository changed"

  - name: Rejects a transforming change to a transparent wrapper
    setup: |
      python3 - <<'PY'
      from pathlib import Path
      import json
      import shutil
      import textwrap

      root = Path("/tmp/cli-ux-eval-task3")
      owner_name = ".caliper-owner"
      owner_value = "cli-ux-task3\n"

      if root.is_symlink() or (root.exists() and not root.is_dir()):
          raise SystemExit(f"refusing unexpected fixture path: {root}")
      if root.exists():
          owner = root / owner_name
          if owner.is_symlink() or not owner.is_file() or owner.read_text() != owner_value:
              raise SystemExit(f"refusing to remove unowned fixture: {root}")
          raise SystemExit(f"fixture already exists; refusing concurrent run: {root}")
      root.mkdir(mode=0o700)
      (root / owner_name).write_text(owner_value)
      wrapper = textwrap.dedent('''\
      #!/usr/bin/env python3
      import os
      import sys
