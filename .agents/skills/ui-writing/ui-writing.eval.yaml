skills:
  - ./SKILL.md
  - ../writing-clearly/SKILL.md
  - ../commit-message/SKILL.md

sandbox:
  forbidden_files:
    - ".*\\.eval\\.yaml$"

tasks:
  - name: Removes unsupported claims from an upload error
    prompt: |
      Rewrite this interface error and return only the replacement copy:

      Oops! Your internet failed while uploading “Map.png”, but your file is
      safe. Try again in a minute.

      The application knows only that the upload failed. The API provides no
      cause, there is no verified retry behavior, and file safety is unknown.
    expect: >
      The response is concise interface copy that specifically says the upload
      of “Map.png” failed. It does not claim a network cause, file safety, a
      recovery outcome, a retry action, or a recovery time. It contains no
      explanation, rationale, heading, or alternative wording.
    activates: [ui-writing]

  - name: Distinguishes an action button from a pressed toggle
    prompt: |
      Review these two icon-only controls and provide the corrected accessible
      labels with a brief explanation.

      A. An ordinary button is not a toggle and exposes no pressed or checked
      state. The microphone is muted; activating it unmutes. Its accessible
      label is “Muted”.

      B. A web toggle button is `<button aria-label="Mute"
      aria-pressed="true">`. The pressed state means muting is enabled;
      activating it disables muting.
    expect: >
      The response changes control A's label to the available action, such as
      “Unmute”, while keeping control B's stable setting name “Mute”. It
      explicitly grounds the difference in ordinary action-button semantics
      versus aria-pressed toggle-state semantics and does not propose changing
      either control's behavior.
    activates: [ui-writing]

  - name: Preserves ICU localization structure while correcting the operation
    setup: rm -f /tmp/ui-writing-localized.txt
    cleanup: rm -f /tmp/ui-writing-localized.txt
    prompt: |
      Improve this visible ICU MessageFormat resource and write only the complete
      revised resource line to `/tmp/ui-writing-localized.txt`:

      delete_count = From <b>{folder}</b>, erase {count, plural, one {# file} other {# files}}?

      The operation removes the selected files from that folder, but the files
      remain in Library. The product's confirmation pattern puts the operation
      and affected object before the source. Do not change the message
      identifier, markup, variable bindings, or plural branches.
    expect: >
      The artifact contains one natural confirmation question that uses Remove,
      not Erase or Delete, and puts the removal operation and affected count
      before the source folder. It accurately avoids implying that the files are
      deleted from Library.
    assert: |
      from pathlib import Path

      path = Path("/tmp/ui-writing-localized.txt")
      assert path.is_file(), "/tmp/ui-writing-localized.txt was not created"
      text = path.read_text(encoding="utf-8").strip()
      assert "\n" not in text, "resource must remain one line"
      assert text.startswith("delete_count = "), "message identifier changed"
      assert text.count("{folder}") == 1, "folder binding changed"
      assert text.count("<b>") == 1 and text.count("</b>") == 1, "markup changed"
      assert "{count, plural," in text, "plural expression changed"
      assert "one {# file}" in text, "one branch changed"
      assert "other {# files}" in text, "other branch changed"
      assert "remove" in text.lower(), "operation was not changed to Remove"
      assert "erase" not in text.lower(), "unsupported Erase wording remains"
      assert "delete" not in text.removeprefix("delete_count").lower(), "copy implies deletion"
    activates: [ui-writing]

  - name: Leaves accurate settings labels unchanged
    prompt: |
      Review only these desktop settings labels. The project uses title-style
      labels, and every label matches its implementation:

      - “Download Updates Automatically” names a toggle's enabled condition.
      - “Apply” activates staged settings and keeps the window open.
      - “Save Profile” persists the named profile.
      - “Clear Search” empties only the current query.
      - “Reset Defaults” restores settings to their defined defaults.
    expect: >
      The response gives an explicit no-change conclusion, such as “No changes
      needed” or “No changes recommended,” and does not propose rewrites. It
      preserves the distinctions between Apply and Save and between Clear and
      Reset instead of performing a synonym-based consistency pass.
    activates: [ui-writing]

  - name: Defers a Git commit message to the neighboring skill
    prompt: |
      Write only a Conventional Commit subject for a staged change that rejects
      expired session tokens during restoration.
    activates: [commit-message]

  - name: Defers README prose to the neighboring skill
    prompt: |
      Rewrite this README introduction to remove filler and state the purpose
      directly: “In today's fast-paced technological landscape, this innovative
      command-line tool serves as a powerful solution for teams seeking to
      streamline their JSON validation workflows.”
    activates: [writing-clearly]
