skills:
  - ./SKILL.md
  - ../deprecation-and-migration/SKILL.md

sandbox:
  forbidden_files:
    - ".*\\.eval\\.yaml$"

tasks:
  - name: Designs a deterministic paginated endpoint
    prompt: |
      Design the public contract for a new internal endpoint:

      `GET /v1/audit-events` lists audit events for one account. Callers may
      filter by event type. Results are newest first, but several events can
      have the same `created_at` value. The endpoint needs cursor pagination,
      a default page size of 50, and a maximum page size of 200. There is no
      previous endpoint, persisted cursor format, or external consumer.

      Define the request, response, validation, machine-readable errors,
      pagination behavior, compatibility impact, and contract tests. Do not
      implement code.
    expect: |
      Pass if the response uses the skill's five required sections and proposes
      a concrete endpoint contract. Pagination has deterministic ordering with
      a unique tie-breaker, an explicit cursor contract, and defined behavior
      for invalid cursors and page sizes. Validation happens at the request
      boundary, errors are machine-readable, compatibility impact reflects
      that this is a new contract, and tests cover ordering and page boundaries.
      Fail if ordering relies only on created_at, errors are prose-only, or the
      response invents a migration.
    activates: [api-and-interface-design]

  - name: Replaces an internal contract atomically
    prompt: |
      Redesign this TypeScript module interface:

      `loadProfile(path): Profile | null`

      `null` currently means either “the file does not exist” or “the file is
      invalid.” Every consumer is maintained in this repository and can be
      updated in the same change. No external consumers, persisted values, or
      compatibility promises exist.

      Propose a contract that lets callers distinguish the outcomes. Include
      compatibility impact, validation, and tests. Do not write implementation
      code.
    expect: |
      Pass if the response proposes an explicit typed result or equivalent
      contract that distinguishes missing and invalid profiles, updates all
      coordinated consumers atomically, and does not add a shim, dual path,
      warning period, version, or staged deprecation. It identifies validation
      and tests for each outcome and uses the five required sections.
      Fail if it assumes a compatibility obligation merely because the return
      type changes.
    activates: [api-and-interface-design]

  - name: Rejects a silent error-semantics change
    prompt: |
      Review this requested API contract change:

      A paginated endpoint currently returns HTTP 400 with
      `{"code":"INVALID_CURSOR","message":"..."}` only when a cursor is malformed
      or expired. When the pagination store is unavailable, the new
      implementation should return that same status and code so existing
      clients require no changes. Keep the outage hidden behind the existing
      error meaning.

      Produce the contract recommendation, compatibility impact, validation
      strategy, and test implications. Do not implement code.
    expect: |
      Pass if the response explicitly rejects using INVALID_CURSOR for a
      backend outage because that silently changes established machine-readable
      semantics. It proposes a distinct stable error code and an appropriate
      retryable server-error status or clearly explains the equivalent
      contract. Tests distinguish malformed or expired cursors from store
      outages. Fail if it accepts the requested reuse, treats the message text
      as sufficient distinction, or silently changes the existing code's
      meaning.
    activates: [api-and-interface-design]
