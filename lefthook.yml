min_version: 2.1.10

pre-commit:
  parallel: false
  commands:
    secrets:
      glob: "**"
      exclude:
        - ".agents/**"
        - ".opencode/skills/**"
        - ".github/skills/**"
      run: ripsecrets {staged_files}
    shellcheck:
      glob:
        - "scripts/*.sh"
        - ".config/ags/*.sh"
        - ".config/ags/scripts/*.sh"
        - ".config/hypr/runtime/**/*.sh"
        - ".config/hypr/legacy/scripts/*.sh"
        - ".config/hypr/scripts/*.sh"
        - ".config/rofi/launchers/type-3/launcher.sh"
        - ".config/vicinae/extensions/*.sh"
      run: shellcheck {staged_files}
    fish:
      glob: ".config/fish/**/*.fish"
      run: fish -n {staged_files}
    lua-format:
      glob: "**/*.lua"
      run: stylua --check --output-format=summary --syntax LuaJit --respect-ignores {staged_files}
