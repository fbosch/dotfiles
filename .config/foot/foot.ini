# Minimal foot config matching wezterm aesthetic

[main]
font = SF Mono:size=10:weight=light, Symbols Nerd Font Mono:size=9, BabelStone Runic Elder Futhark:size=10.8, Apple Color Emoji:size=12
dpi-aware = yes
workers = 6
pad = 2x0

[bell]
urgent = no
notify = no
visual = no

[cursor]
style = block
blink = no

# zenwritten_dark colors
[colors-dark]
alpha = 0.97
blur = yes
foreground = b7b7b7
background = 2d2d2d
selection-foreground = bbbbbb
selection-background = 404040
cursor = 191919 c9c9c9

# Normal colors
regular0 = 191919
regular1 = de6e7c
regular2 = 819b69
regular3 = b77e64
regular4 = 6099c0
regular5 = b279a7
regular6 = 66a5ad
regular7 = bbbbbb

# Bright colors
bright0 = 3d3839
bright1 = e8838f
bright2 = 8bae68
bright3 = d68c67
bright4 = 61abda
bright5 = cf86c1
bright6 = 65b8c1
bright7 = 8e8e8e

[csd]
preferred = none
size = 12
border-width = 0

[tweak]
grapheme-shaping = no
