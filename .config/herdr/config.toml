[keys]
prefix = "ctrl+b"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+c"
last_pane = "prefix+p"
zoom = "prefix+shift+z"

# Ctrl-B avoids capturing Neovim's Ctrl-W window-command prefix.
next_agent = "prefix+w"
previous_agent = "prefix+shift+w"

# [ and ] follow Vim's backward/forward navigation convention for spaces.
previous_workspace = "prefix+["
next_workspace = "prefix+]"

# Select spaces with j/k; use arrows for vertical pane navigation.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

# Move conflicting non-window actions away from Neovim window commands.
new_tab = "prefix+t"
previous_tab = "prefix+alt+comma"
next_tab = "prefix+alt+period"
switch_tab = "prefix+1..9"
close_tab = "prefix+x"
open_notification_target = "prefix+shift+o"
workspace_picker = "prefix+space"

[ui]
pane_gaps = false
agent_panel_sort = "priority"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "fbb.chatgpt-usage.refresh"
description = "Refresh ChatGPT usage"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch or create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch or create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"
