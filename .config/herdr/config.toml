onboarding = false
[theme]
name = "terminal"

auto_switch = false

[keys]
prefix = "ctrl+a"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+w"
last_pane = "prefix+p"
zoom = "prefix+shift+z"

next_agent = "alt+shift+j"
previous_agent = ["prefix+shift+w", "alt+shift+k"]

# [ and ] follow Vim's backward/forward navigation convention for spaces.
previous_workspace = ["prefix+[", "alt+k"]
next_workspace = ["prefix+]", "alt+j"]

# Select spaces with J/K in navigate mode; use arrows for vertical pane navigation.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

# Move conflicting non-window actions away from Neovim window commands.
new_tab = "prefix+t"
previous_tab = ["prefix+alt+comma", "alt+h"]
next_tab = ["prefix+alt+period", "alt+l"]
switch_tab = ["prefix+1..9", "alt+shift+1..9"]
close_tab = "prefix+x"
open_notification_target = "prefix+shift+o"
workspace_picker = "prefix+space"

[ui]
pane_gaps = false
hide_tab_bar_when_single_tab = true
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = false
[ui.sidebar.agents.rows_by_agent]
opencode = [
  ["state_icon", "workspace", "tab"],
  ["$opencode_session_title"],
]

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch or create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch or create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "File viewer: open in split"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "File viewer: open in tab"

[experimental]
pane_history = true

[ui.toast]
delivery = "system"
