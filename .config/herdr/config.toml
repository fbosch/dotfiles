onboarding = false
[theme]
name = "terminal"

auto_switch = false
[theme.zenwritten-dark]
accent = "#6099C0"
panel_bg = "#2C2C2C"
surface0 = "#303030"
surface1 = "#404040"
surface_dim = "#191919"
overlay0 = "#8E8E8E"
overlay1 = "#BBBBBB"
text = "#BBBBBB"
subtext0 = "#8E8E8E"
mauve = "#B279A7"
green = "#819B69"
yellow = "#B77E64"
red = "#DE6E7C"
blue = "#6099C0"
teal = "#66A5AD"
peach = "#D68C67"

[keys]
prefix = "ctrl+a"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+w"
last_pane = "prefix+p"
zoom = "prefix+shift+z"

next_agent = "alt+shift+j"
previous_agent = ["prefix+shift+w", "alt+shift+k"]

# [ and ] follow Vim's backward/forward navigation convention for spaces.
previous_workspace = ["prefix+[", "alt+k"]
next_workspace = ["prefix+]", "alt+j"]

# Select spaces with J/K in navigate mode; use arrows for vertical pane navigation.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

# Move conflicting non-window actions away from Neovim window commands.
new_tab = "prefix+t"
previous_tab = ["prefix+alt+comma", "alt+h"]
next_tab = ["prefix+alt+period", "alt+l"]
switch_tab = ["prefix+1..9", "alt+shift+1..9"]
close_tab = "prefix+x"
open_notification_target = "prefix+shift+o"
workspace_picker = "prefix+space"

[ui]
pane_gaps = false
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
[ui.sidebar.agents.rows_by_agent]
opencode = [
  ["state_icon", "workspace", "tab"],
  ["$opencode_session_title"],
]

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch or create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch or create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "File viewer: open in split"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "File viewer: open in tab"

[[keys.command]]
key = "alt+t"
type = "plugin_action"
command = "terminal-workflows.terminal"
description = "Terminal workflow"

[[keys.command]]
key = "alt+m"
type = "plugin_action"
command = "terminal-workflows.mprocs"
description = "Mprocs workflow"

[[keys.command]]
key = "alt+g"
type = "plugin_action"
command = "terminal-workflows.lazygit"
description = "LazyGit workflow"

[[keys.command]]
key = "alt+shift+g"
type = "plugin_action"
command = "terminal-workflows.gac"
description = "Git add and commit workflow"

[[keys.command]]
key = "alt+b"
type = "plugin_action"
command = "terminal-workflows.btop"
description = "btop workflow"

[[keys.command]]
key = "alt+c"
type = "plugin_action"
command = "terminal-workflows.checkmate"
description = "Checkmate workflow"

[[keys.command]]
key = "alt+s"
type = "plugin_action"
command = "terminal-workflows.scooter"
description = "Scooter workflow"

[experimental]
pane_history = true

[ui.toast]
delivery = "system"
