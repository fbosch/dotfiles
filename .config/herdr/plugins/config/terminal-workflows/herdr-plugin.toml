id = "terminal-workflows"
name = "Terminal workflows"
version = "0.1.0"
description = "Context-aware terminal workflows that preserve Neovim FTerm shortcuts."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[startup]]
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/restore-nvim-sessions.sh\""]

[[actions]]
id = "migrate-nvim-session"
title = "Migrate pane to Neovim session restore"
contexts = ["workspace"]
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/migrate-nvim-session.sh\""]

[[panes]]
id = "terminal"
title = "Terminal"
placement = "overlay"
command = ["fish"]

[[panes]]
id = "mprocs"
title = "mprocs"
placement = "tab"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/mprocs.sh\""]

[[panes]]
id = "lazygit"
title = "LazyGit"
placement = "overlay"
command = ["lazygit"]

[[panes]]
id = "gac"
title = "Git add and commit"
placement = "overlay"
command = ["fish", "-ic", "git add --all && ai_commit; exec fish"]

[[panes]]
id = "btop"
title = "btop"
placement = "overlay"
command = ["btop", "-p", "2", "--update", "1000"]

[[panes]]
id = "checkmate"
title = "Checkmate"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/checkmate.sh\""]

[[panes]]
id = "scooter"
title = "Scooter"
placement = "overlay"
command = ["scooter"]
