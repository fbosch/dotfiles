id = "worktrunk-lifecycle"
name = "Worktrunk lifecycle"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Runs compatible Worktrunk post-lifecycle hooks for native Herdr worktrees."
platforms = ["linux", "macos"]

[[events]]
on = "worktree.created"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/run-hook.sh\" pre-start"]

[[events]]
on = "worktree.removed"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/scripts/run-hook.sh\" post-remove"]
